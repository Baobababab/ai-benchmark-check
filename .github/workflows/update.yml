name: Update data

on:
  schedule:
    - cron: "30 5 * * *" # every day, 05:30 UTC
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: read

concurrency: update-data # never two updates at the same time

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit the refreshed data files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest
      # fetch.py exits with an error if a source is empty, stale or no longer matches prices.
      # A red run means the data was NOT updated.
      - run: python fetch.py
      # The new data must still produce answers before it is committed.
      - run: python recommend.py eci --top 3
      - name: Commit the data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update data $(date -u +%F)" && git push)
